[workspace]
resolver = "2"
exclude = ["vendor/vizia", "vendor/vizia-plug", "vendor/baseview"]
members = [
  "crates/foxcrush",
  "crates/foxshaper",
  "crates/foxplugs-dsp",
  "crates/foxplugs-plugin",
  "crates/foxplugs-ui",
  "crates/xtask",
]
default-members = ["crates/foxcrush"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/foxfire/foxplugs"

[workspace.dependencies]
foxplugs-dsp = { path = "crates/foxplugs-dsp" }
foxplugs-plugin = { path = "crates/foxplugs-plugin" }
foxplugs-ui = { path = "crates/foxplugs-ui" }
nih_plug = { git = "https://github.com/BillyDM/nih-plug.git" }
nih_plug_xtask = { git = "https://github.com/BillyDM/nih-plug.git" }
vizia_plug = { git = "https://github.com/vizia/vizia-plug.git", rev = "d106863cecb020b492acf00254fb5a61d4cda55d" }

[workspace.metadata]
name = "foxplugs"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Reproducible editor-lifecycle backports; see vendor/README.md.
[patch."https://github.com/vizia/vizia-plug.git"]
vizia_plug = { path = "vendor/vizia-plug" }

[patch."https://github.com/vizia/vizia"]
vizia = { path = "vendor/vizia" }

[patch."https://github.com/vizia/baseview.git"]
baseview = { path = "vendor/baseview" }
